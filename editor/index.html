<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launchpad CFW Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <div class="sidebar" id="sidebar">
      <div id="widget-browser" class="panel">
        <div class="panel-header">
          <h4>Widgets</h4>
        </div>
        <div class="panel-body">
          <div class="widget-category">
            <div class="category-label">NOTES</div>
            <div class="widget-list">
              <div class="widget-item" draggable="true" data-type="note">
                <div class="widget-swatch" style="background:#4488ff"></div>
                <span>MIDI Note</span>
              </div>
            </div>
          </div>
          <div class="widget-category">
            <div class="category-label">CONTROL</div>
            <div class="widget-list">
              <div class="widget-item" draggable="true" data-type="cc">
                <div class="widget-swatch" style="background:#44cc66"></div>
                <span>CC Button</span>
              </div>
              <div class="widget-item" draggable="true" data-type="pc">
                <div class="widget-swatch" style="background:#ff6633"></div>
                <span>Program Change</span>
              </div>
            </div>
          </div>
          <div class="widget-category">
            <div class="category-label">FADERS</div>
            <div class="widget-list">
              <div class="widget-item" draggable="true" data-type="fader">
                <div class="widget-swatch" style="background:#33cccc"></div>
                <span>Fader</span>
              </div>
            </div>
          </div>
          <div class="widget-category">
            <div class="category-label">SYSTEM</div>
            <div class="widget-list">
              <div class="widget-item" draggable="true" data-type="mode_switch">
                <div class="widget-swatch" style="background:#cc44ff"></div>
                <span>Mode Switch</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="properties-panel" class="panel hidden">
        <div class="panel-header">
          <h4 id="prop-title">Properties</h4>
          <button id="prop-close" class="close-btn">✕</button>
        </div>
        <div class="panel-body" id="prop-body">
        </div>
        <div class="panel-footer">
          <button id="prop-remove" class="btn btn-danger">Remove</button>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="toolbar">
        <span class="app-title">Launchpad CFW Editor</span>
        <div class="toolbar-actions">
          <button class="btn" id="btn-preview">Preview: On</button>
          <button class="btn" id="btn-load">Load JSON</button>
          <input type="file" id="file-input" accept=".json" style="display:none">
          <button class="btn" id="btn-export">Export JSON</button>
          <button class="btn" id="btn-modes">Modes…</button>
          <button class="btn" id="btn-clear">Clear All</button>
        </div>
      </div>

      <div class="launchpad-wrap">
        <div class="launchpad" id="launchpad">
          <!-- Generated by app.js -->
        </div>
      </div>
    </div>

  </div>

  <div id="modes-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="panel-header">
        <h4>Modes Registry</h4>
        <button id="modes-close" class="close-btn">✕</button>
      </div>
      <div class="panel-body" id="modes-body">
        <!-- Generated by app.js -->
      </div>
      <div class="panel-footer modes-footer">
        <button id="modes-add" class="btn">+ Add Mode</button>
        <button id="modes-load" class="btn">Load modes.json</button>
        <input type="file" id="modes-file-input" accept=".json" style="display:none">
        <button id="modes-export" class="btn">Export modes.json</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
